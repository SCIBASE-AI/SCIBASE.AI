<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Sample chain-of-custody assistant decision flow</title>
  <desc id="desc">Diagram showing input custody packets flowing through deterministic checks to release revise or hold decisions.</desc>
  <rect width="960" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a">
    <rect x="32" y="94" width="190" height="86" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="58" y="130">Custody packet</text>
    <text x="58" y="156" font-size="14">samples, events, claims</text>
    <path d="M235 137 H326" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="342" y="50" width="270" height="174" rx="10" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="376" y="86">Deterministic checks</text>
    <text x="372" y="118" font-size="14">consent links</text>
    <text x="372" y="144" font-size="14">handoffs and time gaps</text>
    <text x="372" y="170" font-size="14">temperature excursions</text>
    <text x="372" y="196" font-size="14">assay QC and quarantine</text>
    <path d="M626 137 H720" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="736" y="44" width="182" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="790" y="86">RELEASE</text>
    <rect x="736" y="144" width="182" height="72" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="798" y="186">REVISE</text>
    <rect x="736" y="244" width="182" height="72" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="808" y="286">HOLD</text>
    <text x="54" y="264" font-size="15">Output: JSON, Markdown, evidence-linked findings, remediation, research gap prompts</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
