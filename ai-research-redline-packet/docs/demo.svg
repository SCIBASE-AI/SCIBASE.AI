  <text x="734" y="243" font-family="Arial, sans-serif" font-size="16" fill="#43515a">ready to insert</text>

  <rect x="948" y="166" width="284" height="132" rx="8" fill="#ffffff" stroke="#d7dcd9"/>
  <text x="974" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d3340">Citation recs</text>
  <text x="974" y="249" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#8a6500">3</text>
  <text x="1034" y="243" font-family="Arial, sans-serif" font-size="16" fill="#43515a">ranked gaps</text>

  <rect x="48" y="334" width="1184" height="270" rx="8" fill="#ffffff" stroke="#d7dcd9"/>
  <text x="74" y="374" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d3340">Reviewer redlines</text>
  <line x1="74" y1="400" x2="1202" y2="400" stroke="#dde4e1"/>

  <circle cx="91" cy="442" r="9" fill="#df5b4f"/>
  <text x="116" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d3340">Unsupported broad claim</text>
  <text x="376" y="449" font-family="Arial, sans-serif" font-size="15" fill="#43515a">Batch-effect elimination claim has no linked evidence span.</text>
  <rect x="1010" y="422" width="164" height="34" rx="5" fill="#fde5e2"/>
  <text x="1055" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b8332a">blocker</text>

  <circle cx="91" cy="496" r="9" fill="#df5b4f"/>
  <text x="116" y="503" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d3340">p-value language</text>
  <text x="376" y="503" font-family="Arial, sans-serif" font-size="15" fill="#43515a">Viability described as significant with p = 0.08.</text>
  <rect x="1010" y="476" width="164" height="34" rx="5" fill="#fde5e2"/>
  <text x="1055" y="499" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b8332a">blocker</text>

  <circle cx="91" cy="550" r="9" fill="#8a6500"/>
  <text x="116" y="557" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d3340">Citation gap</text>
  <text x="376" y="557" font-family="Arial, sans-serif" font-size="15" fill="#43515a">Recommend donor-line batch effects and viability reporting sources.</text>
  <rect x="1010" y="530" width="164" height="34" rx="5" fill="#fff0cf"/>
  <text x="1050" y="553" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#8a6500">ranked</text>

  <rect x="48" y="632" width="1184" height="48" rx="8" fill="#e6ecea"/>
  <text x="74" y="662" font-family="Arial, sans-serif" font-size="16" fill="#273941">Revision packet: 5 insertion-ready tasks routed to biology pre-submission and statistical-methods templates.</text>
