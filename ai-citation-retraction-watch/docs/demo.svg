<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="AI citation retraction watch demo">
  <rect width="1280" height="720" fill="#f3f7f9"/>
  <rect x="72" y="64" width="1136" height="592" rx="16" fill="#ffffff" stroke="#243746" stroke-width="3"/>
  <text x="112" y="130" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#1d3140">AI Citation Retraction Watch</text>
  <text x="112" y="178" font-family="Arial, sans-serif" font-size="22" fill="#526879">Block unsafe citations before AI-assisted insertion.</text>
  <g transform="translate(112 234)">
    <rect width="260" height="128" rx="10" fill="#e9f4ee" stroke="#5d9774"/>
    <text x="24" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1b5632">4 claims</text>
    <text x="24" y="82" font-family="Arial, sans-serif" font-size="18" fill="#32644a">evaluated for safety</text>
  </g>
  <g transform="translate(406 234)">
    <rect width="260" height="128" rx="10" fill="#fdecec" stroke="#bd5d5d"/>
    <text x="24" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#702424">2 blocked</text>
    <text x="24" y="82" font-family="Arial, sans-serif" font-size="18" fill="#7b3b3b">retraction or concern</text>
  </g>
  <g transform="translate(700 234)">
    <rect width="260" height="128" rx="10" fill="#fff5dd" stroke="#c99431"/>
    <text x="24" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6f4a0c">1 erratum note</text>
    <text x="24" y="82" font-family="Arial, sans-serif" font-size="18" fill="#795b22">allowed with warning</text>
  </g>
  <g transform="translate(112 420)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d3140">Reviewer actions</text>
    <text x="0" y="44" font-family="Arial, sans-serif" font-size="20" fill="#2d424f">critical replace_retracted_citation -> claim-crispr-safety</text>
    <text x="0" y="82" font-family="Arial, sans-serif" font-size="20" fill="#2d424f">high replace_expression_of_concern -> claim-reproducible-models</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="20" fill="#2d424f">medium add_correction_note -> claim-protein-folding</text>
  </g>
  <text x="112" y="616" font-family="Arial, sans-serif" font-size="18" fill="#5f7482">Synthetic data only. No network, credentials, or external citation feeds required.</text>
</svg>
