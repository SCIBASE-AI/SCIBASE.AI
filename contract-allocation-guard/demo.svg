<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Contract Allocation Guard Demo</title>
  <desc id="desc">Visual summary of bundled contract allocation across subscription, AI compute, and analytics licensing revenue.</desc>
  <rect width="1280" height="720" fill="#f7f8fa"/>
  <rect x="80" y="80" width="1120" height="560" rx="18" fill="#ffffff" stroke="#d7dce2" stroke-width="3"/>
  <text x="130" y="150" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2933">Contract Allocation Guard</text>
  <text x="130" y="198" font-family="Inter, Arial, sans-serif" font-size="24" fill="#53606f">Bundled enterprise revenue allocation before booking or deferral</text>
  <rect x="130" y="250" width="300" height="170" rx="14" fill="#e8f3ff" stroke="#8fc7ff"/>
  <text x="160" y="302" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#12385f">Subscription</text>
  <text x="160" y="346" font-family="Inter, Arial, sans-serif" font-size="22" fill="#244b70">Ratable schedule</text>
  <text x="160" y="386" font-family="Inter, Arial, sans-serif" font-size="22" fill="#244b70">Service dates required</text>
  <rect x="490" y="250" width="300" height="170" rx="14" fill="#edf9ef" stroke="#9bd4a5"/>
  <text x="520" y="302" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#174a25">AI Compute</text>
  <text x="520" y="346" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2c5b36">Usage-based earning</text>
  <text x="520" y="386" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2c5b36">Estimate required</text>
  <rect x="850" y="250" width="300" height="170" rx="14" fill="#fff3e0" stroke="#f0bb75"/>
  <text x="880" y="302" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#66400f">Analytics License</text>
  <text x="880" y="346" font-family="Inter, Arial, sans-serif" font-size="22" fill="#75501b">Delivery evidence</text>
  <text x="880" y="386" font-family="Inter, Arial, sans-serif" font-size="22" fill="#75501b">Point-in-time gate</text>
  <line x1="280" y1="460" x2="1000" y2="460" stroke="#c5ccd3" stroke-width="4"/>
  <circle cx="280" cy="460" r="15" fill="#2f80ed"/>
  <circle cx="640" cy="460" r="15" fill="#27ae60"/>
  <circle cx="1000" cy="460" r="15" fill="#f2994a"/>
  <text x="130" y="535" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2933">Checks</text>
  <text x="130" y="578" font-family="Inter, Arial, sans-serif" font-size="22" fill="#53606f">SSP evidence, bundle discounts, line discounts, earned revenue, deferred balances, audit digest</text>
</svg>
