        <text x="34" y="58" class="muted">api-project-export-v3 - 1 affected integrations - no blockers</text>
        <text x="980" y="35" class="state" fill="#0e9f6e">READY</text>
        <text x="980" y="60" class="muted">risk 0</text>
      </g>
      <g transform="translate(72 344)">
