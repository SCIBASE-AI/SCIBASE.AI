<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Scientific challenge lifecycle engine demo</title>
  <desc id="desc">Flow from challenge intake through submission package, arbitration, payout readiness, and IP handoff.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #111827; stroke: #38bdf8; stroke-width: 2; rx: 14; }
      .panel2 { fill: #172033; stroke: #a3e635; stroke-width: 2; rx: 14; }
      .text { fill: #e5e7eb; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .small { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 15px; }
      .muted { fill: #94a3b8; font-family: Inter, Arial, sans-serif; font-size: 14px; }
      .arrow { stroke: #fbbf24; stroke-width: 5; marker-end: url(#arrow); fill: none; }
      .ok { fill: #22c55e; }
      .warn { fill: #f59e0b; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="560"/>
  <text x="48" y="58" class="text">Scientific Bounty System: Challenge Lifecycle Engine</text>
  <text x="48" y="86" class="small">Dependency-free core for intake, submission manifests, arbitration, payout readiness, and IP handoff.</text>

  <rect class="panel" x="48" y="140" width="210" height="150"/>
  <text x="70" y="178" class="text">1. Intake</text>
  <text x="70" y="210" class="small">Rubric weights = 100</text>
  <text x="70" y="234" class="small">NDA + visibility</text>
  <text x="70" y="258" class="small">Prize schedule</text>

  <path class="arrow" d="M270 215 C305 215 315 215 350 215"/>

  <rect class="panel" x="362" y="140" width="230" height="150"/>
  <text x="384" y="178" class="text">2. Submission</text>
  <text x="384" y="210" class="small">Artifact hashes</text>
  <text x="384" y="234" class="small">Deliverable coverage</text>
  <text x="384" y="258" class="small">Reproducibility evidence</text>

  <path class="arrow" d="M604 215 C640 215 650 215 686 215"/>

  <rect class="panel" x="698" y="140" width="230" height="150"/>
  <text x="720" y="178" class="text">3. Arbitration</text>
  <text x="720" y="210" class="small">Conflict screening</text>
  <text x="720" y="234" class="small">Weighted scoring</text>
  <text x="720" y="258" class="small">Threshold gates</text>

  <path class="arrow" d="M812 304 C812 340 812 350 812 386"/>

  <rect class="panel2" x="660" y="398" width="304" height="112"/>
  <circle class="ok" cx="690" cy="434" r="9"/>
  <text x="712" y="441" class="small">Award ready: score 90.05</text>
  <circle class="ok" cx="690" cy="466" r="9"/>
  <text x="712" y="473" class="small">Payout: 25% prototype, 75% final</text>
  <circle class="ok" cx="690" cy="498" r="9"/>
  <text x="712" y="505" class="small">IP handoff: sponsor transfer on payout</text>

  <rect x="48" y="356" width="430" height="154" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="70" y="392" class="text">Review commands</text>
  <text x="70" y="428" class="small">npm test</text>
  <text x="70" y="456" class="small">npm run demo</text>
  <text x="70" y="484" class="muted">Outputs audit hash + payout readiness JSON</text>

  <circle class="warn" cx="992" cy="154" r="9"/>
  <text x="1012" y="160" class="muted">Blocks payout if missing deliverables, conflicts, failed checks, or escrow gap.</text>
</svg>
