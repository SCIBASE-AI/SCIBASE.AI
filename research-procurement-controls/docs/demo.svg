<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SCIBASE research procurement controls demo</title>
  <desc id="desc">A compact dashboard showing purchase order holds, invoice mismatches, and audit digest readiness.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="48" y="44" width="864" height="452" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="86" y="100" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">Research Procurement Controls</text>
  <text x="86" y="134" fill="#475569" font-family="Arial, sans-serif" font-size="18">Institutional revenue guardrails for SCIBASE issue #20</text>
  <g font-family="Arial, sans-serif">
    <rect x="86" y="178" width="220" height="120" rx="6" fill="#ecfdf5" stroke="#86efac"/>
    <text x="110" y="222" fill="#166534" font-size="42" font-weight="700">1</text>
    <text x="110" y="254" fill="#166534" font-size="18">invoice matched</text>
    <text x="110" y="278" fill="#64748b" font-size="14">usage-to-invoice proof</text>
    <rect x="370" y="178" width="220" height="120" rx="6" fill="#fffbeb" stroke="#facc15"/>
    <text x="394" y="222" fill="#854d0e" font-size="42" font-weight="700">2</text>
    <text x="394" y="254" fill="#854d0e" font-size="18">budget holds</text>
    <text x="394" y="278" fill="#64748b" font-size="14">threshold and approval controls</text>
    <rect x="654" y="178" width="220" height="120" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="678" y="222" fill="#991b1b" font-size="42" font-weight="700">1</text>
    <text x="678" y="254" fill="#991b1b" font-size="18">blocked order</text>
    <text x="678" y="278" fill="#64748b" font-size="14">overspend protection</text>
    <rect x="86" y="340" width="788" height="88" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="110" y="382" fill="#0f172a" font-size="18" font-weight="700">Audit export</text>
    <text x="110" y="410" fill="#334155" font-size="16">Redacted, deterministic, digest-backed finance review package</text>
  </g>
</svg>
