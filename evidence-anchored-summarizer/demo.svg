<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Evidence anchored summarizer demo">
  <rect width="1280" height="720" fill="#10201a"/>
  <text x="72" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">Evidence-Anchored Summarizer</text>
  <text x="72" y="142" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">SCIBASE issue #13 - AI-assisted research tools</text>
  <rect x="72" y="205" width="320" height="150" rx="18" fill="#172a22" stroke="#34d399" stroke-width="4"/>
  <text x="104" y="260" fill="#d1fae5" font-family="Arial, sans-serif" font-size="30" font-weight="700">1. Claims</text>
  <text x="104" y="306" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Objective, methods, results</text>
  <rect x="480" y="205" width="320" height="150" rx="18" fill="#172a22" stroke="#38bdf8" stroke-width="4"/>
  <text x="512" y="260" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="30" font-weight="700">2. Evidence</text>
  <text x="512" y="306" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Anchor every bullet</text>
  <rect x="888" y="205" width="320" height="150" rx="18" fill="#172a22" stroke="#f59e0b" stroke-width="4"/>
  <text x="920" y="260" fill="#fef3c7" font-family="Arial, sans-serif" font-size="30" font-weight="700">3. Modes</text>
  <text x="920" y="306" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Abstract, executive, plain</text>
  <rect x="72" y="445" width="1136" height="148" rx="18" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="104" y="500" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Demo result: READY</text>
  <text x="104" y="548" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">Top finding links to ev-results and generates implications plus next steps.</text>
  <text x="104" y="590" fill="#86efac" font-family="Arial, sans-serif" font-size="22">Unanchored claims are blocked before a summary is shared.</text>
</svg>
