<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Scientific bounty provenance guard demo summary">
  <rect width="960" height="540" fill="#f7f8fb"/>
  <rect x="48" y="44" width="864" height="452" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="80" y="96" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Scientific Bounty Provenance Guard</text>
  <text x="80" y="136" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Pre-payout duplicate and evidence provenance triage for solver submissions</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="80" y="190" width="220" height="116" fill="#dcfce7" stroke="#166534"/>
    <text x="112" y="240" fill="#166534">Release</text>
    <text x="112" y="276" fill="#166534">0 clean</text>
    <rect x="330" y="190" width="220" height="116" fill="#fef9c3" stroke="#854d0e"/>
    <text x="362" y="240" fill="#854d0e">Revise</text>
    <text x="362" y="276" fill="#854d0e">1 incomplete</text>
    <rect x="580" y="190" width="220" height="116" fill="#fee2e2" stroke="#991b1b"/>
    <text x="612" y="240" fill="#991b1b">Hold</text>
    <text x="612" y="276" fill="#991b1b">2 duplicate</text>
  </g>
  <text x="80" y="366" font-family="Arial, sans-serif" font-size="20" fill="#111827">Guard checks</text>
  <text x="80" y="404" font-family="Arial, sans-serif" font-size="17" fill="#374151">artifact sha256, dataset license, reproducibility note, cross-team hash reuse, near-duplicate rationale</text>
  <text x="80" y="456" font-family="Arial, sans-serif" font-size="17" fill="#374151">No payment processing, private data, credentials, external APIs, or legal conclusions.</text>
</svg>
