<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Graph Recommendation Visibility Guard</title>
  <desc id="desc">A visual summary showing public, institutional, restricted, and embargoed graph recommendations being evaluated before display.</desc>
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect x="72" y="72" width="1136" height="576" rx="24" fill="#f8fafc"/>
  <text x="120" y="142" fill="#0f172a" font-family="Arial, sans-serif" font-size="44" font-weight="700">Knowledge Graph Recommendation Visibility Guard</text>
  <text x="120" y="188" fill="#475569" font-family="Arial, sans-serif" font-size="24">Suppress private, embargoed, and restricted graph paths before discovery surfaces expose them.</text>
  <g transform="translate(120 250)">
    <rect width="250" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="24" y="48" fill="#14532d" font-family="Arial, sans-serif" font-size="28" font-weight="700">Visible</text>
    <text x="24" y="86" fill="#166534" font-family="Arial, sans-serif" font-size="22">Public + institution-safe</text>
  </g>
  <g transform="translate(405 250)">
    <rect width="250" height="130" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <text x="24" y="48" fill="#78350f" font-family="Arial, sans-serif" font-size="28" font-weight="700">Review</text>
    <text x="24" y="86" fill="#92400e" font-family="Arial, sans-serif" font-size="22">Expired embargo metadata</text>
  </g>
  <g transform="translate(690 250)">
    <rect width="250" height="130" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="24" y="48" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="28" font-weight="700">Suppressed</text>
    <text x="24" y="86" fill="#991b1b" font-family="Arial, sans-serif" font-size="22">Embargo or missing access</text>
  </g>
  <g transform="translate(120 448)">
    <circle cx="38" cy="38" r="38" fill="#2563eb"/>
    <text x="94" y="30" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Recommendation path</text>
    <text x="94" y="68" fill="#475569" font-family="Arial, sans-serif" font-size="22">node visibility + evidence access + viewer context + audit digest</text>
  </g>
  <text x="120" y="590" fill="#0f172a" font-family="Arial, sans-serif" font-size="24">Output: visible recommendations, suppressed paths, curator actions, stable digest</text>
</svg>
