    <text x="112" y="548" fill="#fca5a5" font-size="34" font-weight="700">Decision: HOLD</text>
    <text x="112" y="590" fill="#cbd5e1">Regenerate stale supplements and resolve reviewer/data-steward gates before export.</text>
