  <text x="78" y="120" font-family="Arial, sans-serif" font-size="17" fill="#dce9ef">Pre-submission action packet for organoid manuscript review</text>
  <rect x="914" y="63" width="278" height="48" rx="6" fill="#df5b4f"/>
  <text x="944" y="94" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">REVISE BEFORE SUBMIT</text>

  <rect x="48" y="166" width="270" height="132" rx="8" fill="#ffffff" stroke="#d7dcd9"/>
