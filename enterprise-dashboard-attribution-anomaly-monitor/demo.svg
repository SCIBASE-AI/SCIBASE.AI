<svg xmlns="http://www.w3.org/2000/svg" width="940" height="596" viewBox="0 0 940 596"><rect width="940" height="596" fill="#f5f7fb"/><text x="38" y="42" font-family="Arial" font-size="25" font-weight="700" fill="#1d2733">Enterprise Dashboard Attribution Monitor</text><text x="38" y="66" font-family="Arial" font-size="14" fill="#657080">Protects executive metrics from duplicate identity, service-account, collaboration, and visibility-boundary inflation.</text><g transform="translate(38 88)"><rect x="0" y="0" width="864" height="60" rx="8" fill="#ffffff" stroke="#dfe5ee"/><text x="18" y="24" font-family="Arial" font-size="15" font-weight="700" fill="#1d2733">usage_spike</text><text x="18" y="46" font-family="Arial" font-size="12" fill="#657080">dashboard credit 111 in one day exceeds institutional review threshold</text><rect x="742" y="20" width="92" height="22" rx="11" fill="#be123c"/><text x="764" y="35" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">high</text></g><g transform="translate(38 166)"><rect x="0" y="0" width="864" height="60" rx="8" fill="#ffffff" stroke="#dfe5ee"/><text x="18" y="24" font-family="Arial" font-size="15" font-weight="700" fill="#1d2733">service_account_credit</text><text x="18" y="46" font-family="Arial" font-size="12" fill="#657080">service account activity must not count as researcher productivity</text><rect x="742" y="20" width="92" height="22" rx="11" fill="#be123c"/><text x="764" y="35" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">high</text></g><g transform="translate(38 244)"><rect x="0" y="0" width="864" height="60" rx="8" fill="#ffffff" stroke="#dfe5ee"/><text x="18" y="24" font-family="Arial" font-size="15" font-weight="700" fill="#1d2733">service_account_credit</text><text x="18" y="46" font-family="Arial" font-size="12" fill="#657080">service account activity must not count as researcher productivity</text><rect x="742" y="20" width="92" height="22" rx="11" fill="#be123c"/><text x