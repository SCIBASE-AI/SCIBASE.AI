<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="502" viewBox="0 0 1120 502">
  <style>
    .page { fill: #f8f9fa; }
    .heading { font: 700 34px Arial, sans-serif; fill: #17202a; }
    .sub { font: 16px Arial, sans-serif; fill: #495057; }
    .title { font: 700 18px Arial, sans-serif; fill: #212529; }
    .meta { font: 14px Arial, sans-serif; fill: #495057; }
    .score { font: 700 18px Arial, sans-serif; fill: #212529; text-anchor: end; }
  </style>
  <rect class="page" width="1120" height="502"/>
  <text x="40" y="54" class="heading">Repository Release Signature Guard</text>
  <text x="40" y="84" class="sub">Checks signed tags, commits, attestations, DOI metadata, and export bundle parity.</text>

  <g transform="translate(40 112)">
    <text x="0" y="0" class="title">rel-clean-preprint-v2</text>
    <text x="0" y="25" class="meta">Decision: publish | Issues: 0</text>
    <rect x="430" y="-18" width="540" height="22" rx="4" fill="#e9ecef"/>
    <rect x="430" y="-18" width="520" height="22" rx="4" fill="#2f9e44"/>
    <text x="990" y="0" class="score">100</text>
  </g>

  <g transform="translate(40 200)">
    <text x="0" y="0" class="title">rel-unsigned-tag</text>
    <text x="0" y="25" class="meta">Decision: hold-release | Issues: 3</text>
    <rect x="430" y="-18" width="540" height="22" rx="4" fill="#e9ecef"/>
    <rect x="430" y="-18" width="333" height="22" rx="4" fill="#d6336c"/>
    <text x="990" y="0" class="score">64</text>
  </g>

  <g transform="translate(40 288)">
    <text x="0" y="0" class="title">rel-attestation-drift</text>
    <text x="0" y="25" class="meta">Decision: hold-release | Issues: 5</text>
    <rect x="430" y="-18" width="540" height="22" rx="4" fill="#e9ecef"/>
    <rect x="430" y="-18" width="125" height="22" rx="4" fill="#d6336c"/>
    <text x="990" y="0" class="score">24</text>
  </g>

  <g transform="translate(40 376)">
    <text x="0" y="0" class="title">rel-expired-untrusted-signer</text>
    <text x="0" y="25" class="meta">Decision: hold-release | Issues: 5</text>
    <rect x="430" y="-18" width="540" height="22" rx="4" fill="#e9ecef"/>
    <rect x="430" y="-18" width="24" height="22" rx="4" fill="#d6336c"/>
    <text x="990" y="0" class="score">0</text>
  </g>
</svg>
