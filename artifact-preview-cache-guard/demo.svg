<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Artifact Preview Cache Guard</title>
  <desc id="desc">A visual summary showing artifact previews being reused, regenerated, or held based on hash, version, metadata, and sensitive fields.</desc>
  <rect width="1280" height="720" fill="#111827"/>
  <rect x="70" y="70" width="1140" height="580" rx="24" fill="#f9fafb"/>
  <text x="120" y="142" fill="#111827" font-family="Arial, sans-serif" font-size="46" font-weight="700">Artifact Preview Cache Guard</text>
  <text x="120" y="188" fill="#4b5563" font-family="Arial, sans-serif" font-size="24">Keep hosted data/code previews aligned with hashes, versions, metadata, and redaction.</text>
  <g transform="translate(120 250)">
    <rect width="285" height="132" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="28" y="50" fill="#14532d" font-family="Arial, sans-serif" font-size="30" font-weight="700">Reuse</text>
    <text x="28" y="90" fill="#166534" font-family="Arial, sans-serif" font-size="22">Preview matches artifact</text>
  </g>
  <g transform="translate(450 250)">
    <rect width="285" height="132" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="28" y="50" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Regenerate</text>
    <text x="28" y="90" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="22">Hash or version drift</text>
  </g>
  <g transform="translate(780 250)">
    <rect width="285" height="132" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="28" y="50" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="30" font-weight="700">Hold</text>
    <text x="28" y="90" fill="#991b1b" font-family="Arial, sans-serif" font-size="22">Sensitive field exposed</text>
  </g>
  <text x="120" y="470" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700">Inputs</text>
  <text x="120" y="510" fill="#4b5563" font-family="Arial, sans-serif" font-size="23">content hash, upload version, schema version, metadata digest, redacted fields</text>
  <text x="120" y="590" fill="#111827" font-family="Arial, sans-serif" font-size="24">Output: preview plan, dataset diff summary, FAIR warnings, stable audit digest</text>
</svg>
