<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="FX settlement reconciliation guard demo summary">
  <rect width="1280" height="720" fill="#12151a"/>
  <rect x="72" y="64" width="1136" height="592" rx="18" fill="#f8fafc"/>
  <text x="112" y="128" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#102a43">FX Settlement Reconciliation Guard</text>
  <text x="112" y="174" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#425466">Revenue Infrastructure control for multi-currency invoice remittances</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="112" y="226" width="314" height="142" rx="10" fill="#e6fffa" stroke="#81e6d9"/>
    <text x="138" y="272" font-size="20" fill="#425466">Ready settlements</text>
    <text x="138" y="330" font-size="60" font-weight="700" fill="#047857">1</text>
    <rect x="482" y="226" width="314" height="142" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="508" y="272" font-size="20" fill="#425466">Held for review</text>
    <text x="508" y="330" font-size="60" font-weight="700" fill="#c2410c">2</text>
    <rect x="852" y="226" width="314" height="142" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="878" y="272" font-size="20" fill="#425466">Blocked</text>
    <text x="878" y="330" font-size="60" font-weight="700" fill="#4338ca">0</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#102a43">
    <text x="112" y="438">Checks: FX rate source, provider reference, settlement lag, provider fee cap</text>
    <text x="112" y="488">Outputs: expected base revenue, net remittance, FX variance, booking variance</text>
    <text x="112" y="538">No credentials, payment rails, bank data, or live exchange-rate APIs are touched.</text>
  </g>
  <rect x="112" y="584" width="1054" height="2" fill="#d7dee8"/>
  <text x="112" y="624" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#425466">Synthetic demo artifact for SCIBASE.AI issue #20</text>
</svg>
