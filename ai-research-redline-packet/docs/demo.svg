  <text x="134" y="243" font-family="Arial, sans-serif" font-size="16" fill="#43515a">issues found</text>

  <rect x="348" y="166" width="270" height="132" rx="8" fill="#ffffff" stroke="#d7dcd9"/>
  <text x="374" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d3340">Blockers</text>
  <text x="374" y="249" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#df5b4f">2</text>
  <text x="434" y="243" font-family="Arial, sans-serif" font-size="16" fill="#43515a">must fix first</text>

  <rect x="648" y="166" width="270" height="132" rx="8" fill="#ffffff" stroke="#d7dcd9"/>
  <text x="674" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d3340">Revision tasks</text>
