<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI research redline packet demo</title>
  <desc id="desc">Dashboard showing AI-assisted manuscript redlines, citation recommendations, and revision tasks.</desc>
  <rect width="1280" height="720" fill="#f6f6f2"/>
  <rect x="48" y="42" width="1184" height="92" rx="8" fill="#1d3340"/>
