<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#1a1a2e" />
  <text x="400" y="50" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">IP Management Compliance Guard</text>
  
  <rect x="50" y="100" width="200" height="80" rx="10" fill="#16213e" stroke="#0f3460" stroke-width="2" />
  <text x="150" y="145" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Submission Manifest</text>
  
  <path d="M 250 140 L 350 140" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <rect x="350" y="100" width="200" height="80" rx="10" fill="#16213e" stroke="#e94560" stroke-width="2" />
  <text x="450" y="145" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Licensing Engine</text>

  <path d="M 550 140 L 650 140" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <rect x="650" y="100" width="100" height="80" rx="10" fill="#16213e" stroke="#4CAF50" stroke-width="2" />
  <text x="700" y="145" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Status</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
    </marker>
  </defs>
</svg>
