<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Invoice acceptance evidence gate demo report">
  <style>
    .bg { fill: #101418; }
    .panel { fill: #172026; stroke: #33424d; stroke-width: 1; }
    .title { fill: #f4f7f8; font: 700 30px system-ui, -apple-system, Segoe UI, sans-serif; }
    .label { fill: #b7c5cc; font: 600 16px system-ui, -apple-system, Segoe UI, sans-serif; }
    .value { fill: #f4f7f8; font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; }
    .small { fill: #d7e0e4; font: 14px system-ui, -apple-system, Segoe UI, sans-serif; }
    .ready { fill: #47c27a; }
    .review { fill: #f2b84b; }
    .blocked { fill: #ef6a6a; }
    .muted { fill: #7f9098; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="48" y="64" class="title">Invoice Acceptance Evidence Gate</text>
  <text x="48" y="94" class="muted">Audit digest fbeae4fb0d818229 · synthetic data · as of 2026-05-20</text>
  <rect x="48" y="124" width="864" height="168" rx="8" class="panel"/>
  <text x="80" y="162" class="label">Ready to invoice</text>
  <rect x="250" y="143" width="415" height="28" rx="4" class="ready"/>
  <text x="710" y="166" class="value">$18,950</text>
  <text x="80" y="212" class="label">Needs review</text>
  <rect x="250" y="193" width="92" height="28" rx="4" class="review"/>
  <text x="710" y="216" class="value">$4,200</text>
  <text x="80" y="262" class="label">Blocked</text>
  <rect x="250" y="243" width="440" height="28" rx="4" class="blocked"/>
  <text x="710" y="266" class="value">$20,100</text>
  <rect x="48" y="314" width="864" height="150" rx="8" class="panel"/>
  <text x="48" y="496" class="muted">Gate output: finance can invoice approved acceptance packets and route blockers to owners before revenue leaks.</text>
  <text x="48" y="330" class="small">1. license-export-wave-3 - rejected_evidence, evidence_score_below_policy, aging_unbilled_revenue - $12500</text>
<text x="48" y="368" class="small">2. reproducibility-milestone-2 - missing_evidence, evidence_score_below_policy, aging_unbilled_revenue - $7600</text>
<text x="48" y="406" class="small">3. ai-compute-may-burst - pending_acceptance - $1701</text>
</svg>
