    <text x="24" y="108" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="58" font-weight="700">1</text>
  </g>
  <g transform="translate(354 158)">
    <rect width="250" height="154" rx="8" fill="#a16207"/>
    <text x="24" y="48" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20" font-weight="700">Author Response</text>
    <text x="24" y="108" fill="#fffbeb" font-family="Arial, sans-serif" font-size="58" font-weight="700">2</text>
  </g>
