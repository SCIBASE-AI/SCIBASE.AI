version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scibase_community
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/scibase_community
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-not-for-production
      NEXTAUTH_URL_INTERNAL: http://app:3000
      GITHUB_ID: placeholder
      GITHUB_SECRET: placeholder
      CRON_SECRET: dev-cron-secret
      # Set DEMO_SEED=true in the shell before running to seed sample data:
      #   DEMO_SEED=true docker compose --profile full up --build
      DEMO_SEED: ${DEMO_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
