<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Scientific artifact storage deduplication demo</title>
  <desc id="desc">A static demo frame showing storage deduplication decisions, quota state, and savings.</desc>
  <rect width="960" height="540" fill="#f6f7f9"/>
  <rect x="48" y="42" width="864" height="456" rx="8" fill="#ffffff" stroke="#cdd4df"/>
  <text x="82" y="94" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2433">Artifact Storage Dedup Ledger</text>
  <text x="82" y="126" font-family="Arial, sans-serif" font-size="15" fill="#536071">Content-addressed scientific storage - as of 2026-05-16</text>
  <g font-family="Arial, sans-serif">
    <rect x="82" y="162" width="220" height="92" rx="6" fill="#e7f6ee" stroke="#9bd2b2"/>
    <text x="104" y="194" font-size="16" font-weight="700" fill="#155d36">Ready</text>
    <text x="104" y="232" font-size="38" font-weight="700" fill="#155d36">0</text>
    <rect x="326" y="162" width="220" height="92" rx="6" fill="#fff7df" stroke="#e1c778"/>
    <text x="348" y="194" font-size="16" font-weight="700" fill="#735900">Needs review</text>
    <text x="348" y="232" font-size="38" font-weight="700" fill="#735900">2</text>
    <rect x="570" y="162" width="220" height="92" rx="6" fill="#fdecec" stroke="#ecaaa6"/>
    <text x="592" y="194" font-size="16" font-weight="700" fill="#8a1f18">Blocked</text>
    <text x="592" y="232" font-size="38" font-weight="700" fill="#8a1f18">1</text>
    <text x="82" y="304" font-size="15" font-weight="700" fill="#1d2433">Project</text>
    <text x="372" y="304" font-size="15" font-weight="700" fill="#1d2433">Decision</text>
    <text x="532" y="304" font-size="15" font-weight="700" fill="#1d2433">Savings</text>
    <text x="662" y="304" font-size="15" font-weight="700" fill="#1d2433">Action</text>
    <line x1="82" y1="322" x2="838" y2="322" stroke="#dce2ea"/>
    <text x="82" y="354" font-size="14" fill="#1d2433">proj-neuro-atlas</text>
    <text x="372" y="354" font-size="14" fill="#735900">needs_review</text>
    <text x="532" y="354" font-size="14" fill="#155d36">300 MB</text>
    <text x="662" y="354" font-size="14" fill="#536071">large model routing</text>
    <text x="82" y="398" font-size="14" fill="#1d2433">proj-climate-forecast</text>
    <text x="372" y="398" font-size="14" fill="#735900">needs_review</text>
    <text x="532" y="398" font-size="14" fill="#155d36">400 MB</text>
    <text x="662" y="398" font-size="14" fill="#536071">preview invalidation</text>
    <text x="82" y="442" font-size="14" fill="#1d2433">proj-quantum-traces</text>
    <text x="372" y="442" font-size="14" fill="#8a1f18">blocked</text>
    <text x="532" y="442" font-size="14" fill="#8a1f18">0 MB</text>
    <text x="662" y="442" font-size="14" fill="#536071">quota and missing hash</text>
  </g>
  <text x="82" y="478" font-family="Arial, sans-serif" font-size="13" fill="#536071">Signed audit events preserve deduplication and storage-tier decisions for reviewer workflows.</text>
</svg>
