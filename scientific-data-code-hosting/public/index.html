<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCIBASE Data & Code Hosting</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p>SCIBASE.AI / issue #14</p>
        <h1>Scientific Data & Code Hosting</h1>
      </header>
      <section class="grid">
        <article class="panel hero">
          <p class="label">Storage Engine</p>
          <h2 id="storage">Loading...</h2>
          <div id="artifacts"></div>
        </article>
        <article class="panel">
          <p class="label">Metadata & FAIR</p>
          <h2>Standards bundle</h2>
          <div id="metadata"></div>
        </article>
        <article class="panel">
          <p class="label">Versioning</p>
          <h2>Dataset diff</h2>
          <div id="diff"></div>
        </article>
        <article class="panel">
          <p class="label">Executable Environment</p>
          <h2>Sandbox run</h2>
          <div id="execution"></div>
        </article>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
