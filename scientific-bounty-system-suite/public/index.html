<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCIBASE Scientific Bounty System</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">SCIBASE.AI</p>
        <h1>Scientific Bounty System</h1>
        <p class="summary">
          Challenge posting, private submissions, arbitration, prize routing, and IP policy
          workflows for applied research marketplaces.
        </p>
      </header>

      <section class="metric-grid" id="metrics"></section>

      <section class="columns">
        <article>
          <h2>Challenge</h2>
          <div id="challenge"></div>
        </article>
        <article>
          <h2>Submission</h2>
          <div id="submission"></div>
        </article>
        <article>
          <h2>Arbitration</h2>
          <div id="arbitration"></div>
        </article>
        <article>
          <h2>Payouts</h2>
          <div id="payouts"></div>
        </article>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
