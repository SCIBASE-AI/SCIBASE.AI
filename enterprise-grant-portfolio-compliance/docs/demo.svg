<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise grant portfolio compliance demo</title>
  <desc id="desc">A static demo frame showing grant compliance scores, export decisions, and signed event evidence.</desc>
  <rect width="960" height="540" fill="#f6f7f9"/>
  <rect x="48" y="42" width="864" height="456" rx="8" fill="#ffffff" stroke="#cdd4df"/>
  <text x="82" y="94" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2433">Grant Portfolio Compliance</text>
  <text x="82" y="126" font-family="Arial, sans-serif" font-size="15" fill="#536071">Northbridge Institute - as of 2026-05-16</text>
  <g font-family="Arial, sans-serif">
    <rect x="82" y="162" width="220" height="92" rx="6" fill="#e7f6ee" stroke="#9bd2b2"/>
    <text x="104" y="194" font-size="16" font-weight="700" fill="#155d36">Ready</text>
    <text x="104" y="232" font-size="38" font-weight="700" fill="#155d36">1</text>
    <rect x="326" y="162" width="220" height="92" rx="6" fill="#fff7df" stroke="#e1c778"/>
    <text x="348" y="194" font-size="16" font-weight="700" fill="#735900">Needs review</text>
    <text x="348" y="232" font-size="38" font-weight="700" fill="#735900">1</text>
    <rect x="570" y="162" width="220" height="92" rx="6" fill="#fdecec" stroke="#ecaaa6"/>
    <text x="592" y="194" font-size="16" font-weight="700" fill="#8a1f18">Blocked</text>
    <text x="592" y="232" font-size="38" font-weight="700" fill="#8a1f18">1</text>
    <text x="82" y="307" font-size="15" font-weight="700" fill="#1d2433">Grant</text>
    <text x="374" y="307" font-size="15" font-weight="700" fill="#1d2433">Decision</text>
    <text x="538" y="307" font-size="15" font-weight="700" fill="#1d2433">Score</text>
    <text x="644" y="307" font-size="15" font-weight="700" fill="#1d2433">Primary action</text>
    <line x1="82" y1="324" x2="838" y2="324" stroke="#dce2ea"/>
    <text x="82" y="356" font-size="14" fill="#1d2433">HORIZON-CLIMATE-782</text>
    <text x="374" y="356" font-size="14" fill="#155d36">ready</text>
    <text x="538" y="356" font-size="14" fill="#155d36">100</text>
    <text x="644" y="356" font-size="14" fill="#536071">Export package can be certified</text>
    <text x="82" y="398" font-size="14" fill="#1d2433">UKRI-QUANTUM-008</text>
    <text x="374" y="398" font-size="14" fill="#735900">needs_review</text>
    <text x="538" y="398" font-size="14" fill="#735900">88</text>
    <text x="644" y="398" font-size="14" fill="#536071">Impact statement due in 6 days</text>
    <text x="82" y="440" font-size="14" fill="#1d2433">NIH-R01-NEURO-142</text>
    <text x="374" y="440" font-size="14" fill="#8a1f18">blocked</text>
    <text x="538" y="440" font-size="14" fill="#8a1f18">0</text>
    <text x="644" y="440" font-size="14" fill="#536071">Resolve overdue report and evidence gaps</text>
  </g>
  <text x="82" y="478" font-family="Arial, sans-serif" font-size="13" fill="#536071">Signed event digest sample is produced by npm run demo for webhook-ready integrations.</text>
