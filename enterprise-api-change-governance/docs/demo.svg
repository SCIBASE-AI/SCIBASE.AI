    <text x="22" y="42" class="muted">793bd6d911b7dfb2499178e3d595bf52</text>
  </g>
  
      <g transform="translate(72 232)">
        <rect width="1116" height="82" rx="14" fill="#ffffff" stroke="#d9e2ec"/>
        <rect width="12" height="82" rx="6" fill="#0e9f6e"/>
